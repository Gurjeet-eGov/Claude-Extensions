<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bug Reporter</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/common.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="row">
      <img src="../icons/icon32.png" width="20" height="20" alt="" />
      <strong class="grow">Bug Reporter</strong>
      <button id="settings" class="icon-btn" title="Settings" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="gear-body" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/><circle class="gear-hole" cx="12" cy="12" r="3"/></svg>
      </button>
      <span class="help-wrap">
        <button id="help" class="help-btn" aria-label="Keyboard shortcuts" aria-describedby="keysTip" aria-expanded="false">?</button>
        <div id="keysTip" role="tooltip" class="tip"><div class="tip-title">Keyboard shortcuts</div><div id="keysList" class="tip-keys"></div></div>
      </span>
    </header>

    <section id="site" class="block">
      <div id="siteOn" class="hidden">
        <div class="row"><span class="dot ok"></span><span class="grow">Capturing APIs on <b id="host1"></b></span></div>
        <div class="muted small" id="stats"></div>
      </div>
      <div id="siteOff" class="hidden">
        <div class="row"><span class="dot"></span><span class="grow">Not capturing on <b id="host2"></b></span></div>
        <button id="enable" class="primary full">Enable on this site</button>
        <div class="muted small">Captures fetch/XHR calls and console errors on this site only.</div>
      </div>
      <div id="siteNa" class="hidden muted">Open your web app tab to capture its API calls.</div>
    </section>

    <section class="block">
      <div id="recRow" class="row">
        <span id="recDot" class="dot"></span>
        <span id="recLabel" class="grow">Not recording</span>
        <span id="recInfo" class="muted small mono"></span>
      </div>
      <div class="row btns">
        <button id="recStart" class="rec">● Start recording</button>
        <button id="recPause" class="hidden">❚❚ Pause</button>
        <button id="recResume" class="hidden rec">● Resume</button>
        <button id="recStop" class="stop hidden">■ Stop</button>
      </div>
      <div id="clip" class="clip-line muted small hidden"></div>
      <div id="recError" class="notice bad small hidden"></div>
    </section>

    <section class="block">
      <div class="row btns">
        <button id="update" class="grow">Update Issue</button>
        <button id="report" class="primary grow">Report issue</button>
      </div>
      <div class="row btns pair">
        <button id="snap" class="grow"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2.5h6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>Screenshot <span id="tray" class="muted"></span></button>
        <button id="loc" class="grow">Track localizations</button>
      </div>
      <div id="locInfo" class="small loc-info hidden"></div>
    </section>

    <footer class="muted small">
      <span id="helper"></span>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
